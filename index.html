
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unimate Code Compiler</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <main class="container">
        <h2>Unimate Code Compiler</h2>

        <label for="language">Programming Language</label>
        <select id="language">
            <option value="c">C</option>
            <option value="java">Java</option>
        </select>

        <label for="code">Your Code</label>
        <textarea id="code" spellcheck="false" placeholder="Write your code here..."></textarea>

        <label for="input">Program Input (stdin)</label>
        <textarea id="input" spellcheck="false" placeholder="Enter input here (optional)..."></textarea>

        <button id="runButton">Run Code</button>

        <h3>Output</h3>
        <pre id="output">Your output will appear here...</pre>
    </main>

    <script src="script.js"></script>
</body>
</html>
